name: 更新模组索引

on:
  schedule:
    # 每 2 小时一次（每小时 :17，避开整点高峰）；最新 100 tag 每 2 小时刷新，
    # 第 2 页每周、全量每月由脚本内 state/refresh.json 的到期判断控制
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # 首次 push / 改脚本时立即生成首份数据；数据提交不匹配这些路径，不会触发回环
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-mods.yml"

permissions:
  contents: write

# 与 update-mindustry.yml 共用同一个组，避免两个工作流同时 push
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 取最新默认分支而不是 event SHA：两个 update workflow 共用 concurrency 串行，
          # 后跑者要能看到先跑者刚推送的提交（含 status.json/versions 等），避免 rebase 冲突
          ref: main

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 迁移旧 schemaVersion（0 API）
        # formatVersion 1 → 2：旧 per-mod 文件、index、summary、status/changes 本地一次性补新字段；
        # 已迁移时是 no-op，保证即使本轮 API 配额不足，validate 也不会因旧结构报错。
        run: node src/main.js --migrate --out .

      - name: 更新模组索引与热度表
        # 官方：2h/周/月分档刷新；社区：GitHub topic 扫描 + Anuken 黑名单同步，与官方同构（独立 state）。
        # 热度表最后算（依赖官方/社区 index/summary/releases）；participation/created_at 每周/永久缓存。
        # 配额共享：先官方后社区，不足时停止本次、保留已抓结果，下次按最久未刷新续跑。
        run: node src/main.js --datasets mods,community,heat --out .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送数据变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index-full.json summary.json summary.csv
          # 运行健康状态与滚动变更流（每次运行都更新，属于预期的小额提交）
          git add status.json changes.json 2>/dev/null || true
          # -A 覆盖 releases/<owner>/<repo>.json 新结构的新增目录，以及旧 flat 文件迁移后的删除
          git add -A releases 2>/dev/null || true
          # 社区 index.json / index-full.json / releases / summary
          git add -A community 2>/dev/null || true
          # 热度历史快照（index/summary 已合并进模组列表，不再单独生成）
          git add -A heat 2>/dev/null || true
          git add -A state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过提交"
            exit 0
          fi
          git commit -m "[auto-update] mods"
          git pull --rebase --autostash
          git push
