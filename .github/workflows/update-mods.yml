name: 更新模组索引

on:
  schedule:
    # 每天 02:23 UTC（北京时间 10:23），避开整点高峰
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # 首次 push / 改脚本时立即生成首份数据；数据提交不匹配这些路径，不会触发回环
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-mods.yml"

permissions:
  contents: write

# 与 update-mindustry.yml 共用同一个组，避免两个工作流同时 push
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 更新模组索引
        # 按 tag 新旧分档刷新：第 1 页每天、第 2 页 7 天、第 3 页 30 天、第 4 页起 90 天。
        # per-mod 文件只在 releases 数据真的变化时重写；ETag/分页时间存在 state/refresh.json。
        run: node src/main.js --datasets mods --out .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交并推送数据变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json summary.json summary.csv
          # releases / state 目录首次运行时可能还没有文件
          git add -A releases 2>/dev/null || true
          git add -A state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过提交"
            exit 0
          fi
          git commit -m "[auto-update] mods"
          git pull --rebase --autostash
          git push
